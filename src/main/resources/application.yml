# All secrets come from environment variables. See the repository .env.example.
spring:
  application:
    name: job-portal-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:jobportal_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is created only by database/schema.sql. Hibernate never touches it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-resume-bytes: 5242880
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Platform Administrator}
  demo:
    password: ${DEMO_PASSWORD:Demo@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
